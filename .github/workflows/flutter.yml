name: flutter
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: server
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1; rc=$?
          grep -E "^ *error" analyze.txt | head -45 | while IFS= read -r l; do echo "::error::A $l"; done
          exit $rc
      - name: test
        if: always()
        run: |
          flutter test --reporter expanded > test.txt 2>&1; rc=$?
          grep -E "\[E\]|Error:|error:|Expected:|Actual:" test.txt | head -40 | while IFS= read -r l; do echo "::warning::T $l"; done
          exit $rc
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'
      - name: build apk
        id: apk
        if: always()
        run: |
          { flutter build apk --release --flavor standard && flutter build apk --release --flavor autosend; } > build.txt 2>&1; rc=$?
          grep -iE "error|FAILURE|What went wrong" -A2 build.txt | head -40 | while IFS= read -r l; do echo "::error::B $l"; done
          exit $rc
      - name: report logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -vE "^ *info " analyze.txt | head -150; echo '--- TEST'; grep -E "\[E\]|rror|Expected|Actual|Which|\.dart:[0-9]+" test.txt | head -120; echo '--- BUILD'; grep -iE "error|wrong|FAIL" -A3 build.txt | head -80; echo '```'; } > report.md || true
          gh api repos/${{ github.repository }}/commits/$GITHUB_SHA/comments -F body=@report.md || true
      - name: publish release
        if: steps.apk.outcome == 'success' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-standard-release.apk autometa.apk
          cp build/app/outputs/flutter-apk/app-autosend-release.apk autometa-autosend.apk
          git archive --format=zip --prefix=AUTOMETA/ -o autometa-source.zip HEAD
          gh release delete latest-build -y --cleanup-tag || true
          gh release create latest-build autometa.apk autometa-autosend.apk autometa-source.zip --prerelease --target "$GITHUB_SHA" \
            --title "AUTOMETA latest build" --notes "autometa.apk = Standard (installs normally). autometa-autosend.apk = adds WhatsApp auto-send; Play Protect blocks it when sideloaded, so install from a computer with: adb install -r autometa-autosend.apk. Built from $GITHUB_SHA."
